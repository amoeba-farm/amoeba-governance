[workspace]
resolver = "2"

[package]
name = "ameba-artifact-chunk-sbf-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.3.0"

[dev-dependencies]
serde_json = "=1.0.145"
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
