[workspace]
members = ["programs/upgrade_controller"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
borsh = "=0.10.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-program = { version = "=2.3.0", default-features = false }
solana-pubkey = { version = "=2.4.0", default-features = false, features = ["borsh"] }
thiserror = "=2.0.18"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = 0
strip = "debuginfo"
